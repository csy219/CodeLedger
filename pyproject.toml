[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeledger"
version = "0.1.0"
description = "Verifiable code-repair agent harness and RepoFix application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = [
  "apps/api/src",
  "packages/core/src",
  "packages/mcp/src",
  "packages/sandbox/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
pythonpath = [
  "apps/api/src",
  "packages/core/src",
  "packages/mcp/src",
  "packages/sandbox/src",
]

[tool.ruff]
line-length = 100
target-version = "py311"